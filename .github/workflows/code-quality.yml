name: Java Gradle 代码质量检查

on:
  push:
    branches: [ main, master ]  # 改成你实际的分支名
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle  # 开启Gradle缓存，大幅提速

      - name: 赋予gradlew执行权限
        run: chmod +x gradlew

      - name: Gradle 编译与检查
        run: |
          ./gradlew compileJava
          ./gradlew check